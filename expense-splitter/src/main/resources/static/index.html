<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Expense Settlement Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li class="main-title">Collaborative Expense Splitter</li>
            <div class="nav-links-group"> 
                <li><a href="#home" onclick="showPage('home-page', this)" class="active">Home</a></li>
                <li><a href="#settlements" onclick="showPage('settlement-page', this)">Settlements</a></li>
                <li><a href="#spending" onclick="showPage('spending-page', this)">Spending</a></li>
                <li><a href="#balance" onclick="showPage('balance-page', this)">Balance</a></li>
            </div>
            <li><button id="themeSwitcher" class="theme-switcher" onclick="toggleTheme()">Device Theme</button></li>
        </ul>
    </nav>
    
    <div class="page-container">
        
        <div id="home-page" class="content-section active">
            </div>

        <div id="settlement-page" class="content-section">
            </div>

        <div id="spending-page" class="content-section">
            </div>

        <div id="balance-page" class="content-section">
            </div>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
