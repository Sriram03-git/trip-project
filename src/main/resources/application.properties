spring.application.name=expense-splitter

# Spring Boot Application Port
server.port=${PORT:8080}

# -----------------
# 1. PostgreSQL Database Configuration
# -----------------
# Using environment variables with fallbacks for local development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trip_express_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=org.postgresql.Driver

# -----------------
# 2. JPA/Hibernate Configuration
# -----------------
# Recommendation: Change 'create' to 'update' for deployment to prevent data loss on restart
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in the console for debugging
spring.jpa.show-sql=true

# -----------------
# 3. JPA Dialect for PostgreSQL
# -----------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------
# Mobile Access
#-----------------
server.address=0.0.0.0